name: Validation modele

# Le runner ubuntu-24.04-arm est du silicium ARM64 reel et reste gratuit
# sur les depots publics. Il tient lieu de cible ARM distante sans
# necessiter aucune ressource materielle ni acces entreprise.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  benchmark:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            label: x86_64
          - runner: ubuntu-24.04-arm
            label: arm64
    runs-on: ${{ matrix.runner }}
    name: Benchmark ${{ matrix.label }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installation des dependances
        run: pip install -r requirements.txt

      - name: Installation de torch (export uniquement)
        run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Export ONNX
        run: python src/export_onnx.py --arch mobilenet_v2 --output models/model.onnx

      - name: Reparation du graphe ONNX
        run: python src/repair_onnx.py --input models/model.onnx --output models/model_clean.onnx

      - name: Quantification INT8
        run: python src/quantize.py --input models/model_clean.onnx --output models/model_int8.onnx

      - name: Benchmark FP32
        run: python src/benchmark.py --model models/model.onnx --runs 50 --out results/${{ matrix.label }}_fp32.json

      - name: Benchmark INT8
        run: python src/benchmark.py --model models/model_int8.onnx --runs 50 --out results/${{ matrix.label }}_int8.json

      - name: Verification du budget
        run: python src/check_budget.py --report results/${{ matrix.label }}_int8.json --budget budget.json

      - name: Publication des rapports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-${{ matrix.label }}
          path: results/
